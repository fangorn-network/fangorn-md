# Run: pnpm build && docker compose up --build   (reads secrets from .env)
#
# `pnpm build` first: the image ships the prebuilt dist/ rather than running
# vite itself, so low-memory hosts (Pi) never have to bundle. VITE_PRIVY_APP_ID
# is inlined into the bundle by that local build, not by docker.
#
# The server needs .fangorn/repos.json to exist. On first run either init a repo
# via the CLI first, or bring the stack up and create one from the UI.
services:
  fangornmd:
    build:
      context: .
    ports:
      - "8787:8787"
    env_file: .env
    volumes:
      - ./docs:/app/docs        # working tree (per-namespace note files)
      - ./.fangorn:/app/.fangorn # repo store + local head pointers
    restart: unless-stopped
